[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc = "0.8.28"
# Robinhood Chain is an Arbitrum Orbit L2 running Nitro v3.11.3 / ArbOS 116,
# which is well past the Cancun cutoff (tstore/mcopy/PUSH0 all supported).
evm_version = "cancun"

optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.ci]
verbosity = 3
fuzz = { runs = 1000 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
rh_testnet = "https://rpc.testnet.chain.robinhood.com"
rh_mainnet = "https://rpc.chain.robinhood.com"
localhost = "http://127.0.0.1:8545"
